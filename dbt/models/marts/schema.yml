version: 2

models:
  - name: dim_team
    description: "One row per team."
    columns:
      - name: team_id
        data_tests:
          - unique
          - not_null
      - name: team_name
        data_tests:
          - not_null
  
  - name: dim_match
    description: "One row per match."
    columns:
      - name: match_id
        data_tests:
          - unique
          - not_null
      - name: home_team_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_id
      - name: away_team_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_id
      - name: match_result
        data_tests:
          - accepted_values:
              arguments:
                values: ['home_win', 'away_win', 'draw']
  - name: dim_player
    description: "One row per player seen in events."
    columns:
      - name: player_id
        data_tests:
          - unique
          - not_null
      - name: player_name
        data_tests:
          - not_null  
  - name: fct_events
    description: "One row per event."
    columns:
      - name: event_id
        data_tests:
          - unique
          - not_null
      - name: match_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_match')
                field: match_id
      - name: team_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_id
      - name: player_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_player')
                field: player_id
  - name: fct_shots
    description: "One row per shot."
    columns:
      - name: event_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('fct_events')
                field: event_id
      - name: match_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_match')
                field: match_id
      - name: shot_outcome
        data_tests:
          - not_null